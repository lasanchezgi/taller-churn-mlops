openapi: 3.1.0
info:
  title: Servicio de riesgo de churn, campaña de retención y monitoreo
  version: 2.0.0
  description: >
    Contrato de la interfaz del servicio (spec 002). El servicio apoya la decisión de retención; no
    decide ni ejecuta acciones sobre clientes. Toda respuesta con predicciones o contactos incluye el
    aviso de uso responsable. Los campos no previstos (incluida la edad) se rechazan.
servers:
  - url: http://localhost:8000
paths:
  /predict:
    post:
      summary: Predicción para un cliente (FR-001..008)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cliente' }
      responses:
        '200':
          description: Predicción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediccion' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }
        '429': { $ref: '#/components/responses/LimiteSolicitudes' }
        '503': { $ref: '#/components/responses/ModeloNoDisponible' }
  /predict/lote:
    post:
      summary: Puntuar un lote y resumir clientes e ingresos en riesgo (FR-009, FR-010)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lote' }
      responses:
        '200':
          description: Una predicción por cliente, en el mismo orden, más el resumen
          content:
            application/json:
              schema:
                type: object
                required: [predicciones, resumen, mensaje_resumen, aviso_uso_responsable]
                properties:
                  predicciones:
                    type: array
                    items: { $ref: '#/components/schemas/Prediccion' }
                  resumen:
                    oneOf: [{ $ref: '#/components/schemas/ResumenRiesgo' }, { type: 'null' }]
                  mensaje_resumen: { type: [string, 'null'], description: Presente si el lote tiene menos de 20 clientes }
                  aviso_uso_responsable: { type: string }
        '422': { $ref: '#/components/responses/ErrorValidacion' }
        '429': { $ref: '#/components/responses/LimiteSolicitudes' }
        '503': { $ref: '#/components/responses/ModeloNoDisponible' }
  /campana/contactos:
    post:
      summary: Elegir a quién contactar dentro del presupuesto (FR-011, FR-012)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientes]
              additionalProperties: false
              properties:
                clientes:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/Cliente' }
                presupuesto:
                  type: number
                  minimum: 0.01
                  maximum: 100000
                  default: 2000
                costo_por_contacto:
                  type: number
                  minimum: 0.01
                  maximum: 1000
                  default: 8
      responses:
        '200':
          description: Lista de contacto ordenada por ingreso esperado en riesgo (probabilidad × cargo mensual) descendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaContacto' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }
        '429': { $ref: '#/components/responses/LimiteSolicitudes' }
        '503': { $ref: '#/components/responses/ModeloNoDisponible' }
  /drift:
    get:
      summary: Último informe de cambio de datos guardado (FR-014)
      responses:
        '200':
          description: Último informe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InformeCambioDatos' }
        '404':
          description: Aún no hay informe
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
    post:
      summary: Comparar un lote reciente con los datos de entrenamiento (FR-014)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lote' }
      responses:
        '200':
          description: Informe de cambio de datos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InformeCambioDatos' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }
        '429': { $ref: '#/components/responses/LimiteSolicitudes' }
  /health:
    get:
      summary: Estado del servicio (FR-013)
      responses:
        '200':
          description: Servicio sano
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoServicio' }
        '503':
          description: Servicio activo pero sin modelo (no sano)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoServicio' }
  /metrics:
    get:
      summary: Último resumen de riesgo, último informe de cambio de datos y métricas del modelo (FR-010, FR-014, FR-019)
      responses:
        '200':
          description: Métricas agregadas, sin identificadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  predicciones_totales: { type: integer }
                  errores_totales: { type: integer, description: Respuestas 422, 503 y 500 }
                  distribucion_riesgo:
                    type: object
                    description: Conteo por nivel (alto, medio, bajo)
                  latencia_ms:
                    type: object
                    description: p50 y p95 de las últimas predicciones (nulos sin datos)
                  negocio:
                    type: object
                    description: Clientes e ingresos en riesgo alto, priorizados, costo y ROI esperado sobre las últimas 1000 predicciones del proceso (en memoria, sin identificadores)
                  modelo:
                    type: [object, 'null']
                    description: Versión, umbral y métricas offline del model card (nulo sin modelo)
                  ultimo_resumen:
                    oneOf: [{ $ref: '#/components/schemas/ResumenRiesgo' }, { type: 'null' }]
                  ultimo_cambio_datos:
                    oneOf: [{ $ref: '#/components/schemas/InformeCambioDatos' }, { type: 'null' }]
  /dashboard:
    get:
      summary: Vista visual de solo lectura (FR-019)
      responses:
        '200':
          description: Página HTML estática
          content:
            text/html:
              schema: { type: string }
components:
  responses:
    LimiteSolicitudes:
      description: Se superó el límite de solicitudes por minuto por IP (60 por defecto, FR-020)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    ErrorValidacion:
      description: Datos inválidos; el mensaje nombra el campo, el motivo y los valores permitidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorValidacion' }
    ModeloNoDisponible:
      description: El modelo no está cargado; no se devuelven predicciones
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Cliente:
      type: object
      additionalProperties: false
      required: [antiguedad_meses, tipo_plan, cargo_mensual, reclamos_ult_3m, uso_datos_gb, metodo_pago, renovo_contrato]
      properties:
        antiguedad_meses: { type: integer, minimum: 1, maximum: 120 }
        tipo_plan: { type: string, enum: [prepago, pospago_basico, pospago_premium] }
        cargo_mensual: { type: number, minimum: 10, maximum: 1000 }
        reclamos_ult_3m: { type: integer, minimum: 0, maximum: 6 }
        uso_datos_gb: { type: number, minimum: 0, maximum: 1000 }
        metodo_pago: { type: string, enum: [tarjeta_credito, debito_automatico, efectivo, transferencia] }
        renovo_contrato: { type: string, enum: ['si', 'no'] }
        id_cliente: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', description: Solo trazabilidad; se registra codificado }
    Lote:
      type: object
      additionalProperties: false
      required: [clientes]
      properties:
        clientes:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/Cliente' }
    Prediccion:
      type: object
      required: [probabilidad_churn, nivel_riesgo, recomendacion, version_modelo, aviso_uso_responsable]
      properties:
        probabilidad_churn: { type: number, minimum: 0, maximum: 1 }
        nivel_riesgo: { type: string, enum: [alto, medio, bajo] }
        recomendacion: { type: string }
        version_modelo: { type: string, examples: ['1.0.0'] }
        aviso_uso_responsable: { type: string }
        alerta_equidad: { type: string, description: Presente mientras el modelo no esté aprobado (FR-026) }
    ResumenRiesgo:
      type: object
      description: Solo se publica con al menos 20 clientes en el lote (FR-010)
      required: [total_clientes, clientes_riesgo_alto, porcentaje_riesgo_alto, ingresos_mensuales_en_riesgo, ingresos_6_meses_en_riesgo, version_modelo, fecha]
      properties:
        total_clientes: { type: integer }
        clientes_riesgo_alto: { type: integer }
        porcentaje_riesgo_alto: { type: number }
        ingresos_mensuales_en_riesgo: { type: number }
        ingresos_6_meses_en_riesgo: { type: number }
        version_modelo: { type: string }
        fecha: { type: string, format: date-time }
    ListaContacto:
      type: object
      required: [presupuesto, costo_por_contacto, max_contactos, clientes_en_riesgo_alto, contactos, costo_total, aviso_uso_responsable]
      properties:
        presupuesto: { type: number }
        costo_por_contacto: { type: number }
        max_contactos: { type: integer }
        clientes_en_riesgo_alto: { type: integer }
        contactos:
          type: array
          items:
            type: object
            required: [posicion_en_lote, probabilidad_churn, nivel_riesgo, recomendacion, ingreso_esperado]
            properties:
              posicion_en_lote: { type: integer, minimum: 1 }
              probabilidad_churn: { type: number }
              nivel_riesgo: { type: string, enum: [alto, medio, bajo] }
              recomendacion: { type: string }
              ingreso_esperado: { type: number, description: probabilidad × cargo mensual }
              id_cliente: { type: string }
        costo_total: { type: number }
        mensaje: { type: string, description: Presente si la lista queda vacía }
        aviso_uso_responsable: { type: string }
    InformeCambioDatos:
      type: object
      required: [estado_general, variables, fecha]
      properties:
        estado_general: { type: string, enum: [estable, alerta, critico, datos_insuficientes] }
        variables:
          type: array
          items:
            type: object
            required: [nombre, psi, nivel]
            properties:
              nombre: { type: string }
              psi: { type: number, minimum: 0 }
              nivel: { type: string, enum: [estable, alerta, critico] }
        recomendacion: { type: string }
        fecha: { type: string, format: date-time }
    EstadoServicio:
      type: object
      required: [estado, modelo_cargado]
      properties:
        estado: { type: string, enum: [sano, no_sano] }
        modelo_cargado: { type: boolean }
        version_modelo: { type: [string, 'null'] }
        aprobado_para_despliegue: { type: [boolean, 'null'] }
        alertas: { type: array, items: { type: string }, description: Razones de no aprobación (FR-028) }
        error: { type: [string, 'null'] }
    ErrorValidacion:
      type: object
      required: [detalle]
      properties:
        error: { type: string, examples: ['Entrada inválida'] }
        detalle:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              posicion_cliente: { type: integer, description: Solo en lotes }
              mensaje: { type: string }
