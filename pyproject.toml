[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-telco"
version = "1.0.0"
description = "Taller: ASUM-DM + SDD + ECC + OpenCode + MLOps para churn en telecomunicaciones"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Opcional (D11): seguimiento local de experimentos y registro de versiones; la API no lo necesita
mlflow = ["mlflow>=3.1"]

# `uv sync` instala este grupo por defecto, así que no quita pytest; `--extra dev` sigue funcionando
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
